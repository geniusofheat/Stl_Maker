<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>STL Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stl_maker_stylesheet.css">
</head>
<body>
<div id="app">
  <header id="h1"></header>

  <div id="h2">
    <div class="h2-text">
      <span class="h2-title" id="h2Title">Shapes</span>
      <span class="h2-info" id="h2Info">Tap a shape to add it</span>
    </div>
    <div class="h2-actions">
      <button class="h2-btn" id="btnUndo" disabled></button>
      <button class="h2-btn" id="btnRedo" disabled></button>
    </div>
  </div>

  <div id="main">
    <div id="slideMenu">
      <div class="menu-scroll" id="menuScroll"></div>
      <button id="expandTab" title="Expand"></button>
    </div>
    <div id="plate">
      <div class="plate-hint" id="plateHint">drag with one finger to orbit</div>
      <canvas id="viewport3d"></canvas>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
    
<script type="module" src="stl_maker_data.js"></script>
<script type="module" src="stl_maker_engine2.js"></script>
</body>
</html>
